# Manu Sign op Coolify: gebaseerd op Coolify's Documenso-sjabloon, met ons eigen image en een
# ondertekeningscertificaat dat bewaard blijft (wordt alleen de eerste keer aangemaakt).
services:
  documenso:
    image: ghcr.io/zegmaarmanu/manu-sign:latest
    depends_on:
      database:
        condition: service_healthy
    environment:
      - SERVICE_URL_DOCUMENSO_3000
      - NEXTAUTH_URL=${SERVICE_URL_DOCUMENSO}
      - NEXTAUTH_SECRET=${SERVICE_BASE64_AUTHSECRET}
      - NEXT_PRIVATE_ENCRYPTION_KEY=${SERVICE_BASE64_ENCRYPTIONKEY}
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=${SERVICE_BASE64_SECONDARYENCRYPTIONKEY}
      - NEXT_PUBLIC_WEBAPP_URL=${SERVICE_URL_DOCUMENSO}
      - NEXT_PRIVATE_SMTP_TRANSPORT=smtp-auth
      - NEXT_PRIVATE_SMTP_HOST=smtp.hostinger.com
      - NEXT_PRIVATE_SMTP_PORT=465
      - NEXT_PRIVATE_SMTP_SECURE=true
      - NEXT_PRIVATE_SMTP_USERNAME=${SMTP_USERNAME:-manu@zegmaarmanu.be}
      - NEXT_PRIVATE_SMTP_PASSWORD=${SMTP_PASSWORD}
      - NEXT_PRIVATE_SMTP_FROM_NAME=Manu Sign
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=${SMTP_USERNAME:-manu@zegmaarmanu.be}
      - NEXT_PRIVATE_DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@database/manusign?schema=public
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@database/manusign?schema=public
      - NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH=/app/apps/remix/certs/certificate.p12
      - NEXT_PRIVATE_SIGNING_PASSPHRASE=${SERVICE_PASSWORD_SIGNING}
      - NEXT_PUBLIC_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
    volumes:
      - manusign_certs:/app/apps/remix/certs
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:3000/ | grep -q 'Sign in to your account'"
      interval: 5s
      timeout: 10s
      retries: 30
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /app/apps/remix/certs/certificate.p12 ]; then
          cd /app/apps/remix/certs
          printf '[req]\ndistinguished_name=dn\nprompt=no\n[dn]\nC=BE\nO=Zeg maar Manu\nCN=Manu Sign\nemailAddress=manu@zegmaarmanu.be\n' > /tmp/cert.cnf
          openssl genrsa -out private.key 2048
          openssl req -new -x509 -key private.key -out certificate.crt -days 3650 -config /tmp/cert.cnf
          openssl pkcs12 -export -out certificate.p12 -inkey private.key -in certificate.crt -legacy -passout env:NEXT_PRIVATE_SIGNING_PASSPHRASE
          chown -R nodejs:nodejs /app/apps/remix/certs
        fi
        cd /app/apps/remix && exec su -p -s /bin/sh nodejs -c ./start.sh

  database:
    image: postgres:17
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=manusign
    volumes:
      - manusign_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d manusign"]
      interval: 5s
      timeout: 20s
      retries: 10
