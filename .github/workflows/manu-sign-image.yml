name: Manu Sign image

on:
  push:
    branches: [manu-sign]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/zegmaarmanu/manu-sign:latest
            ghcr.io/zegmaarmanu/manu-sign:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
